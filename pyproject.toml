[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "led-tasso"
version = "0.1.0"
description = "An encouraging original coach for your terminal"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
led-tasso = "led_tasso.cli:main"

[tool.setuptools.package-data]
led_tasso = ["persona.md", "web/*.html", "web/*.js", "web/*.css"]

[tool.setuptools.packages.find]
include = ["led_tasso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
